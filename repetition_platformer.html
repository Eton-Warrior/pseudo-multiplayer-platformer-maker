<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time-Loop Platformer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
            border: 1px solid #333;
        }
        canvas {
            background: #181818;
            border: 3px solid #3a3a3a;
            border-radius: 6px;
            display: block;
            margin: 15px auto;
            cursor: crosshair;
        }
        .toolbar {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            height: 45px;
        }
        button {
            background: #2a2a2a;
            color: #fff;
            border: 2px solid #444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover {
            background: #3a3a3a;
            border-color: #666;
        }
        button.active {
            background: #00bcd4;
            border-color: #008ba3;
            color: #000;
        }
        #message-banner {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 188, 212, 0.95);
            color: #000;
            padding: 15px 30px;
            font-weight: bold;
            font-size: 18px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            z-index: 20;
        }
        #instructions {
            font-size: 13px;
            color: #888;
            max-width: 800px;
            margin-top: 8px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="message-banner">Level Completed!</div>
    <h2 id="mode-title">Mode: Level Editor (Player 1)</h2>
    
    <div class="toolbar" id="editor-tools">
        <button class="active" onclick="setTool('platform', event)">Platform (Solid)</button>
        <button onclick="setTool('hazard', event)">Spikes (Death)</button>
        <button onclick="setTool('spawn', event)">Spawn Point</button>
        <button onclick="setTool('goal', event)">Goal Portal</button>
        <button onclick="clearMap()" style="background:#a94442; border-color:#843534;">Clear Map</button>
        <button onclick="switchMode()" style="background:#3c763d; border-color:#2b542c;">Play Level (Player 2)</button>
    </div>

    <div class="toolbar" id="play-tools" style="display:none;">
        <span id="death-counter" style="font-weight: bold; color: #ff6b6b; margin-right: 15px;">Deaths: 0 | Ghosts: 0</span>
        <button onclick="switchMode()" style="background:#8a6d3b; border-color:#66512c;">Back to Editor</button>
        <button onclick="resetRunData()" style="background:#a94442; border-color:#843534;">Reset Run & Ghosts</button>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="instructions">
        <strong>Editor:</strong> Select a tool and click/drag on the grid. Place 1 Spawn and 1 Goal!<br>
        <strong>Controls:</strong> A/D to Move, W/Space to Jump, **X** to end run early. Stand on top of your ghosts to climb higher!
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const TILE_SIZE = 25;
    const COLS = canvas.width / TILE_SIZE;
    const ROWS = canvas.height / TILE_SIZE;

    let mode = 'editor'; // 'editor' or 'play'
    let currentTool = 'platform'; 

    let map = Array(ROWS).fill().map(() => Array(COLS).fill(0));

    let spawnPos = { x: 50, y: 350 };
    let goalPos = { x: 700, y: 100 };

    let player = {
        x: spawnPos.x,
        y: spawnPos.y,
        w: 18,
        h: 26,
        vx: 0,
        vy: 0,
        speed: 3.5,
        jumpForce: -9.5,
        gravity: 0.42,
        grounded: false
    };

    let keys = {};
    let deaths = 0;
    
    let ghosts = [];          
    let currentRunPath = [];  
    let playbackFrame = 0;    
    let isWon = false;
    let isDead = false;

    window.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        if (e.code === 'KeyX' && mode === 'play' && !isWon && !isDead) {
            playerDie();
        }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    let isDrawing = false;
    canvas.addEventListener('mousedown', (e) => { if(mode === 'editor') { isDrawing = true; handleEditorClick(e); } });
    canvas.addEventListener('mousemove', (e) => { if(mode === 'editor' && isDrawing) { handleEditorClick(e); } });
    window.addEventListener('mouseup', () => { isDrawing = false; });

    function setTool(tool, event) {
        currentTool = tool;
        document.querySelectorAll('#editor-tools button').forEach(b => b.classList.remove('active'));
        if(event && event.target) event.target.classList.add('active');
    }

    function handleEditorClick(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const c = Math.floor(mouseX / TILE_SIZE);
        const r = Math.floor(mouseY / TILE_SIZE);

        if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
            if (currentTool === 'spawn') {
                if (map[r][c] === 2) {
                    showBanner("Cannot place spawn on spikes!", 2000);
                    return;
                }
                for(let y=0; y<ROWS; y++) for(let x=0; x<COLS; x++) if(map[y][x] === 3) map[y][x] = 0;
                map[r][c] = 3;
                spawnPos = { x: c * TILE_SIZE, y: r * TILE_SIZE };
            } else if (currentTool === 'goal') {
                for(let y=0; y<ROWS; y++) for(let x=0; x<COLS; x++) if(map[y][x] === 4) map[y][x] = 0;
                map[r][c] = 4;
                goalPos = { x: c * TILE_SIZE, y: r * TILE_SIZE };
            } else if (currentTool === 'platform') {
                if (map[r][c] !== 3 && map[r][c] !== 4) map[r][c] = 1;
            } else if (currentTool === 'hazard') {
                if (map[r][c] !== 3 && map[r][c] !== 4) map[r][c] = 2;
            }
        }
    }

    function clearMap() {
        map = Array(ROWS).fill().map(() => Array(COLS).fill(0));
    }

    function switchMode() {
        hideBanner();
        if (mode === 'editor') {
            let hasSpawn = false, hasGoal = false;
            for(let y=0; y<ROWS; y++) {
                for(let x=0; x<COLS; x++) {
                    if(map[y][x] === 3) hasSpawn = true;
                    if(map[y][x] === 4) hasGoal = true;
                }
            }
            if(!hasSpawn || !hasGoal) {
                showBanner("Please place both a Spawn Point and a Goal Portal!", 3000);
                return;
            }

            mode = 'play';
            document.getElementById('mode-title').innerText = "Mode: Beat the Level (Player 2)";
            document.getElementById('editor-tools').style.display = 'none';
            document.getElementById('play-tools').style.display = 'flex';
            resetRunData();
        } else {
            mode = 'editor';
            document.getElementById('mode-title').innerText = "Mode: Level Editor (Player 1)";
            document.getElementById('editor-tools').style.display = 'flex';
            document.getElementById('play-tools').style.display = 'none';
        }
    }

    function resetRunData() {
        deaths = 0;
        ghosts = [];
        isWon = false;
        isDead = false;
        hideBanner();
        updateUI();
        respawnPlayer();
    }

    function respawnPlayer() {
        player.x = spawnPos.x;
        player.y = spawnPos.y;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        currentRunPath = [];
        playbackFrame = 0;
        isDead = false;
    }

    function playerDie() {
        if (isWon || isDead) return;
        isDead = true;
        deaths++;
        
        if (currentRunPath.length > 2) {
            ghosts.push([...currentRunPath]);
        }
        
        updateUI();
        respawnPlayer();
    }

    function updateUI() {
        document.getElementById('death-counter').innerText = `Deaths: ${deaths} | Ghosts: ${ghosts.length}`;
    }

    function showBanner(text, duration = 0) {
        const banner = document.getElementById('message-banner');
        banner.innerText = text;
        banner.style.display = 'block';
        if (duration > 0) {
            setTimeout(hideBanner, duration);
        }
    }

    function hideBanner() {
        document.getElementById('message-banner').style.display = 'none';
    }

    function checkRectCollision(nx, ny) {
        let left = Math.floor(nx / TILE_SIZE);
        let right = Math.floor((nx + player.w - 1) / TILE_SIZE);
        let top = Math.floor(ny / TILE_SIZE);
        let bottom = Math.floor((ny + player.h - 1) / TILE_SIZE);

        for (let r = top; r <= bottom; r++) {
            for (let c = left; c <= right; c++) {
                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    let tile = map[r][c];
                    if (tile === 1 || tile === 2 || tile === 4) {
                        return { collision: true, type: tile };
                    }
                }
            }
        }
        return { collision: false };
    }

    function getGhostCollisions(nx, ny) {
        let activeGhosts = [];
        ghosts.forEach((ghostRun) => {
            let frameIdx = Math.min(playbackFrame, ghostRun.length - 1);
            let pos = ghostRun[frameIdx];
            if (pos) activeGhosts.push(pos);
        });

        for (let g of activeGhosts) {
            if (nx < g.x + player.w && nx + player.w > g.x &&
                ny < g.y + player.h && ny + player.h > g.y) {
                return g;
            }
        }
        return null;
    }

    function gameLoop() {
        if (mode === 'play' && !isWon && !isDead) {
            let left = keys['KeyA'] || keys['ArrowLeft'];
            let right = keys['KeyD'] || keys['ArrowRight'];
            let jump = keys['KeyW'] || keys['ArrowUp'] || keys['Space'];

            player.vx = 0;
            if (left) player.vx = -player.speed;
            if (right) player.vx = player.speed;

            player.vy += player.gravity;

            // X movement & collision
            player.x += player.vx;
            let colX = checkRectCollision(player.x, player.y);
            let ghostColX = getGhostCollisions(player.x, player.y);

            if (colX.collision) {
                if (colX.type === 2) { playerDie(); }
                else if (colX.type === 4) { 
                    isWon = true;
                    showBanner(`Level Completed with ${deaths} deaths!`);
                    setTimeout(switchMode, 3500);
                }
                if (player.vx > 0) player.x = Math.floor((player.x + player.w) / TILE_SIZE) * TILE_SIZE - player.w - 0.01;
                else if (player.vx < 0) player.x = Math.floor(player.x / TILE_SIZE) * TILE_SIZE + TILE_SIZE + 0.01;
            }
            if (ghostColX) {
                if (player.vx > 0) player.x = ghostColX.x - player.w;
                else if (player.vx < 0) player.x = ghostColX.x + player.w;
            }

            // Y movement & collision
            player.y += player.vy;
            let colY = checkRectCollision(player.x, player.y);
            let ghostColY = getGhostCollisions(player.x, player.y);
            
            player.grounded = false;

            if (colY.collision) {
                if (colY.type === 2) { playerDie(); }
                else if (colY.type === 4) { 
                    isWon = true;
                    showBanner(`Level Completed with ${deaths} deaths!`);
                    setTimeout(switchMode, 3500);
                }
                if (player.vy > 0) {
                    player.y = Math.floor((player.y + player.h) / TILE_SIZE) * TILE_SIZE - player.h - 0.01;
                    player.vy = 0;
                    player.grounded = true;
                } else if (player.vy < 0) {
                    player.y = Math.floor(player.y / TILE_SIZE) * TILE_SIZE + TILE_SIZE + 0.01;
                    player.vy = 0;
                }
            }

            if (ghostColY) {
                if (player.vy > 0) { // Landing on top of ghost
                    player.y = ghostColY.y - player.h;
                    player.vy = 0;
                    player.grounded = true;
                } else if (player.vy < 0) { // Hitting bottom of ghost
                    player.y = ghostColY.y + player.h;
                    player.vy = 0;
                }
            }

            if (jump && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }

            if (player.y > canvas.height || player.x < 0 || player.x > canvas.width) {
                playerDie();
            }

            currentRunPath.push({ x: player.x, y: player.y });
            playbackFrame++;
        }

        drawAll();
        requestAnimationFrame(gameLoop);
    }

    function drawAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Render Map Tiles
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let tile = map[r][c];
                if (tile === 1) {
                    ctx.fillStyle = '#2c2c2c';
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#3a3a3a';
                    ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else if (tile === 2) {
                    ctx.fillStyle = '#d9534f';
                    ctx.beginPath();
                    ctx.moveTo(c * TILE_SIZE, (r + 1) * TILE_SIZE);
                    ctx.lineTo(c * TILE_SIZE + TILE_SIZE / 2, r * TILE_SIZE);
                    ctx.lineTo((c + 1) * TILE_SIZE, (r + 1) * TILE_SIZE);
                    ctx.fill();
                } else if (tile === 3) {
                    ctx.fillStyle = '#449d44';
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = '#fff';
                    ctx.font = '9px sans-serif';
                    ctx.fillText("SPAWN", c * TILE_SIZE + 1, r * TILE_SIZE + 16);
                } else if (tile === 4) {
                    ctx.fillStyle = '#ec971f';
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = '#fff';
                    ctx.font = '9px sans-serif';
                    ctx.fillText("GOAL", c * TILE_SIZE + 2, r * TILE_SIZE + 16);
                }
            }
        }

        if (mode === 'play') {
            // Render Ghosts (Past Selves)
            ghosts.forEach((ghostRun) => {
                let frameIdx = Math.min(playbackFrame, ghostRun.length - 1);
                let pos = ghostRun[frameIdx];
                if (pos) {
                    ctx.fillStyle = '#89fc0';
                    ctx.fillRect(pos.x, pos.y, player.w, player.h);
                }
            });

            // Render Active Player
            if (!isDead) {
                ctx.fillStyle = '#00bcd4';
                ctx.fillRect(player.x, player.y, player.w, player.h);
            }
        }
    }

    requestAnimationFrame(gameLoop);
</script>

</body>
</html>
