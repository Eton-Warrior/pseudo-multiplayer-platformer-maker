<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Page Container</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .nav-btn:hover {
            background-color: #0056b3;
        }
        .frame-container {
            width: 100%;
            max-width: 900px;
            height: 500px;
            margin: 0 auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>My Web Dashboard</h1>

    <!-- Navigation Buttons -->
    <div class="nav-container">
        <button class="nav-btn" onclick="loadPage('Soccer_sim.html')">Soccer</button>
        <button class="nav-btn" onclick="loadPage('Space_program.html')">KSP</button>
        <button class="nav-btn" onclick="loadPage('repetition_platformer.html')">Platform</button>
    </div>

    <!-- Display Area for the HTML files --> 
    <div class="frame-container">
        <iframe id="contentFrame" src="page1.html" title="Content Viewer"></iframe>
    </div>

    <script>
        function loadPage(pageName) {
            document.getElementById('contentFrame').src = pageName;
        }
    </script>

</body>
</html>
